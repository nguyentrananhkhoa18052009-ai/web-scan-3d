<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Coordinate Scanner</title>
  
  <!-- Nạp nguyên vẹn file định dạng CSS gốc của ông -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    /* Bổ sung hiển thị webcam tương thích với Render */
    .camera-box-stream {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 8px;
    }
    #webcam-view {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-container">
      <h1>HỆ THỐNG ĐO TỌA ĐỘ VẬT THỂ 3D</h1>
      <p id="system-status">Trạng thái: Đang kết nối máy chủ...</p>
    </div>
  </header>

  <main class="main-content">
    <section class="camera-section">
      <div class="camera-box-stream">
        <video id="webcam-view" autoplay playsinline muted></video>
        <canvas id="hidden-canvas" style="display: none;"></canvas>
      </div>
      <div class="camera-tools" style="text-align: center; margin-top: 10px;">
        <button id="btn-switch-camera" class="btn">Đổi Camera</button>
      </div>
    </section>

    <section class="dashboard-section">
      <div class="data-panel">
        <div class="metric-card">
          <span class="label">Tọa độ X</span>
          <span id="coord-x" class="val">0.00</span>
          <span class="unit">cm</span>
        </div>
        <div class="metric-card">
          <span class="label">Tọa độ Y</span>
          <span id="coord-y" class="val">0.00</span>
          <span class="unit">cm</span>
        </div>
        <div class="metric-card">
          <span class="label">Tọa độ Z</span>
          <span id="coord-z" class="val">0.00</span>
          <span class="unit">cm</span>
        </div>
      </div>
      <div id="log-status" class="status-alert">Đang khởi tạo luồng camera...</div>
    </section>
  </main>

  <!-- Nạp file JS điều khiển gốc của dự án nếu có -->
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  <script src="/dashboard.js"></script>

  <!-- Script kích hoạt Webcam máy khách và truyền dữ liệu về Render -->
  <script>
    const videoElem = document.getElementById('webcam-view');
    const hiddenCanvas = document.getElementById('hidden-canvas');
    const hCtx = hiddenCanvas.getContext('2d');
    const logBox = document.getElementById('log-status');
    const sysStatus = document.getElementById('system-status');
    const txtX = document.getElementById('coord-x');
    const txtY = document.getElementById('coord-y');
    const txtZ = document.getElementById('coord-z');

    let camStream = null;
    let cameraMode = "environment";
    let sending = false;

    async function initClientCam() {
      if (camStream) {
        camStream.getTracks().forEach(t => t.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: cameraMode, width: { ideal: 640 }, height: { ideal: 480 } }
        });
        camStream = stream;
        videoElem.srcObject = stream;
        sysStatus.innerText = "Trạng thái: Đã kết nối Webcam thiết bị";
        logBox.innerText = "Sẵn sàng gửi khung hình đến thuật toán 3D...";
      } catch (err) {
        sysStatus.innerText = "Trạng thái: Lỗi cấp quyền Camera";
        logBox.innerText = "Vui lòng cho phép trình duyệt truy cập camera: " + err.message;
      }
    }

    document.getElementById('btn-switch-camera').addEventListener('click', () => {
      cameraMode = cameraMode === "environment" ? "user" : "environment";
      initClientCam();
    });

    async function sendScanFrame() {
      if (!camStream || sending || videoElem.videoWidth === 0) return;
      sending = true;

      hiddenCanvas.width = videoElem.videoWidth;
      hiddenCanvas.height = videoElem.videoHeight;
      hCtx.drawImage(videoElem, 0, 0);

      const b64 = hiddenCanvas.toDataURL('image/jpeg', 0.55);

      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: b64 })
        });
        const d = await res.json();
        if (d.success && d.coordinates) {
          if (txtX) txtX.innerText = Number(d.coordinates.x).toFixed(2);
          if (txtY) txtY.innerText = Number(d.coordinates.y).toFixed(2);
          if (txtZ) txtZ.innerText = Number(d.coordinates.z).toFixed(2);
          if (logBox) logBox.innerText = d.message || "Tọa độ cập nhật";
        }
      } catch (e) {
        if (logBox) logBox.innerText = "Lỗi kết nối máy chủ Render";
      } finally {
        sending = false;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initClientCam();
      setInterval(sendScanFrame, 250);
    });
  </script>
</body>
</html>
