<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Box Coordinate Scanner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 12px;
      min-height: 100vh;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #38bdf8;
      text-align: center;
    }
    p.subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
      text-align: center;
    }
    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 4 / 3;
      background-color: #020617;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #334155;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 40px;
      height: 40px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      border: 2px dashed #38bdf8;
      border-radius: 50%;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      width: 100%;
      max-width: 560px;
    }
    button {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: #2563eb;
      color: white;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button.secondary {
      background-color: #334155;
    }
    button.secondary:hover {
      background-color: #475569;
    }
    .data-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 560px;
      margin-top: 16px;
    }
    .card {
      background-color: #1e293b;
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #334155;
    }
    .card-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .card-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: #f1f5f9;
      font-family: monospace;
    }
    .status-box {
      margin-top: 16px;
      padding: 12px 16px;
      background-color: #1e293b;
      border-radius: 8px;
      width: 100%;
      max-width: 560px;
      font-size: 0.85rem;
      color: #cbd5e1;
      text-align: center;
      border-left: 4px solid #38bdf8;
    }
  </style>
</head>
<body>

  <h1>HỆ THỐNG QUÉT TỌA ĐỘ 3D</h1>
  <p class="subtitle">Truyền hình ảnh từ Camera thiết bị về máy chủ Render</p>

  <div class="scanner-container">
    <video id="camera-stream" autoplay playsinline muted></video>
    <div class="crosshair"></div>
  </div>

  <canvas id="capture-canvas" style="display: none;"></canvas>

  <div class="controls">
    <button id="btn-toggle-cam" onclick="toggleCamera()">Đổi Camera</button>
  </div>

  <div class="data-cards">
    <div class="card">
      <div class="card-label">Tọa độ X (cm)</div>
      <div id="val-x" class="card-value">0.00</div>
    </div>
    <div class="card">
      <div class="card-label">Tọa độ Y (cm)</div>
      <div id="val-y" class="card-value">0.00</div>
    </div>
    <div class="card">
      <div class="card-label">Tọa độ Z (cm)</div>
      <div id="val-z" class="card-value">0.00</div>
    </div>
  </div>

  <div id="status-text" class="status-box">Đang khởi tạo camera...</div>

  <script>
    const video = document.getElementById('camera-stream');
    const canvas = document.getElementById('capture-canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status-text');

    const valX = document.getElementById('val-x');
    const valY = document.getElementById('val-y');
    const valZ = document.getElementById('val-z');

    let currentStream = null;
    let useFacingMode = "environment";
    let isProcessing = false;

    // 1. Mở camera từ thiết bị người dùng
    async function startCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useFacingMode, width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        currentStream = stream;
        video.srcObject = stream;
        statusText.innerText = "Camera sẵn sàng. Đang truyền dữ liệu...";
      } catch (err) {
        statusText.innerText = "Lỗi quyền camera: " + err.message;
      }
    }

    // 2. Nút chuyển đổi camera trước/sau
    function toggleCamera() {
      useFacingMode = useFacingMode === "environment" ? "user" : "environment";
      startCamera();
    }

    // 3. Chụp và gửi khung hình về Render
    async function sendFrame() {
      if (!currentStream || isProcessing || video.videoWidth === 0) return;

      isProcessing = true;
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Nén ảnh chất lượng 0.55 để truyền siêu tốc qua mạng
      const base64Image = canvas.toDataURL('image/jpeg', 0.55);

      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Image })
        });
        const result = await response.json();

        if (result.success && result.coordinates) {
          valX.innerText = Number(result.coordinates.x).toFixed(2);
          valY.innerText = Number(result.coordinates.y).toFixed(2);
          valZ.innerText = Number(result.coordinates.z).toFixed(2);
          statusText.innerText = result.message || "Đã nhận diện tọa độ";
        }
      } catch (err) {
        statusText.innerText = "Mất kết nối máy chủ Render";
      } finally {
        isProcessing = false;
      }
    }

    // Tự động khởi động camera và gửi dữ liệu mỗi 250ms
    window.addEventListener('load', () => {
      startCamera();
      setInterval(sendFrame, 250);
    });
  </script>
</body>
</html>
